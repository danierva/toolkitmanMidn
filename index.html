<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Pekerjaan Toolkitman</title>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }

        .container {
            max-width: 1100px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title h1 { color: var(--primary); font-size: 22px; }
        .header-title p { color: #64748b; font-size: 13px; margin-top: 4px; }

        /* Form Styling */
        .form-container {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: none;
            border: 1px solid var(--border);
        }

        .form-container.active { display: block; }
        .form-container h3 { margin-bottom: 15px; color: var(--primary); font-size: 16px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .form-control { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: white; }
        .form-control:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #64748b; color: white; display: none; }
        .btn-login { background-color: var(--primary); color: white; }
        .btn-logout { background-color: var(--danger); color: white; display: none; }

        /* Table Styling */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-responsive { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: var(--primary); color: white; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }

        /* Badges */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-ringan { background-color: #dcfce7; color: #15803d; }
        .badge-sedang { background-color: #fef3c7; color: #b45309; }
        .badge-berat { background-color: #fee2e2; color: #b91c1c; }
        .badge-ganti { background-color: #f3e8ff; color: #6b21a8; }

        .btn-sm { padding: 4px 8px; font-size: 11px; margin-right: 3px; }
        .btn-edit { background-color: var(--warning); color: white; }
        .btn-delete { background-color: var(--danger); color: white; }
        .btn-view { background-color: #0288d1; color: white; text-decoration: none; display: inline-block; border-radius: 4px; padding: 4px 8px; font-size: 11px; }

        .admin-action { display: none; }

        /* Modal Login */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-content h3 { margin-bottom: 15px; color: var(--primary); }
        .modal-content .form-group { margin-bottom: 12px; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .btn-group { width: 100%; }
            .btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>Sistem Laporan Pekerjaan Toolkitman</h1>
            <p>Rekapitulasi Maintenance & Perbaikan Fasilitas</p>
        </div>
        <div>
            <button id="btnLoginNav" class="btn btn-login" onclick="openLoginModal()">🔑 Login Admin</button>
            <button id="btnLogoutNav" class="btn btn-logout" onclick="logoutAdmin()">🚪 Logout Admin</button>
        </div>
    </div>

    <!-- Form Input / Edit Data (Hanya Muncul Saat Admin Login) -->
    <div class="form-container" id="adminFormContainer">
        <h3 id="formTitle">Tambah Laporan Pekerjaan Baru</h3>
        <form id="workForm">
            <input type="hidden" id="editKey" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Teknisi / Toolkitman</label>
                    <input type="text" id="namaTeknisi" placeholder="Contoh: Ahmad" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Jenis Pekerjaan</label>
                    <select id="jenisPekerjaan" class="form-control" required>
                        <option value="Perbaikan Pintu">Perbaikan Pintu</option>
                        <option value="Maintenance Komputer">Maintenance Komputer</option>
                        <option value="Maintenance Listrik">Maintenance Listrik</option>
                        <option value="Perbaikan Saluran Air">Perbaikan Saluran Air</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tingkat Kerusakan</label>
                    <select id="tingkatKerusakan" class="form-control" required>
                        <option value="Ringan">Ringan</option>
                        <option value="Sedang">Sedang</option>
                        <option value="Berat">Berat</option>
                        <option value="Ganti Unit">Ganti Unit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tanggal Maintenance</label>
                    <input type="date" id="tglMaintenance" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Durasi Pengerjaan (Jam)</label>
                    <input type="number" id="durasiJam" step="0.5" min="0.5" placeholder="Contoh: 2" class="form-control" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Detail Deskripsi Pekerjaan</label>
                    <input type="text" id="deskripsi" placeholder="Detail kendala atau tindakan..." class="form-control" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Bukti Pengerjaan (Upload Foto)</label>
                    <input type="file" id="buktiFoto" accept="image/*" class="form-control">
                    <input type="hidden" id="existingImageBase64" value="">
                </div>
            </div>
            <div class="btn-group">
                <button type="button" id="btnCancel" class="btn btn-secondary" onclick="resetForm()">Batal</button>
                <button type="submit" id="btnSave" class="btn btn-primary">Simpan Laporan</button>
            </div>
        </form>
    </div>

    <!-- Tabel Data Pekerjaan -->
    <div class="toolbar">
        <h3>Daftar Laporan Pekerjaan</h3>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Teknisi</th>
                    <th>Jenis Pekerjaan</th>
                    <th>Tingkat Kerusakan</th>
                    <th>Durasi</th>
                    <th>Deskripsi</th>
                    <th>Bukti</th>
                    <th class="admin-action">Aksi</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <tr><td colspan="9" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Login Admin -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3>Login Admin</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
                <button type="button" class="btn btn-secondary" style="display:inline-block;" onclick="closeLoginModal()">Batal</button>
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. ISI DENGAN KONFIGURASI FIREBASE ANDA
    const firebaseConfig = {
        apiKey: "PASTE_API_KEY_ANDA",
        authDomain: "PASTE_AUTH_DOMAIN_ANDA",
        databaseURL: "PASTE_DATABASE_URL_ANDA",
        projectId: "PASTE_PROJECT_ID_ANDA",
        storageBucket: "PASTE_STORAGE_BUCKET_ANDA",
        messagingSenderId: "PASTE_SENDER_ID_ANDA",
        appId: "PASTE_APP_ID_ANDA"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('laporan_toolkitman');

    // KREDENSIAL LOGIN ADMIN
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456";

    let isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn_toolkit') === 'true';

    function checkAdminAuth() {
        const adminForm = document.getElementById('adminFormContainer');
        const btnLoginNav = document.getElementById('btnLoginNav');
        const btnLogoutNav = document.getElementById('btnLogoutNav');
        const adminActions = document.querySelectorAll('.admin-action');

        if (isAdminLoggedIn) {
            adminForm.classList.add('active');
            btnLoginNav.style.display = 'none';
            btnLogoutNav.style.display = 'inline-block';
            adminActions.forEach(el => el.style.display = 'table-cell');
        } else {
            adminForm.classList.remove('active');
            btnLoginNav.style.display = 'inline-block';
            btnLogoutNav.style.display = 'none';
            adminActions.forEach(el => el.style.display = 'none');
        }
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; document.getElementById('loginForm').reset(); }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            isAdminLoggedIn = true;
            sessionStorage.setItem('isAdminLoggedIn_toolkit', 'true');
            closeLoginModal();
            checkAdminAuth();
            alert('Berhasil login sebagai Admin.');
        } else {
            alert('Username atau Password salah!');
        }
    });

    function logoutAdmin() {
        if (confirm('Keluar dari mode Admin?')) {
            isAdminLoggedIn = false;
            sessionStorage.removeItem('isAdminLoggedIn_toolkit');
            checkAdminAuth();
        }
    }

    // Helper Konversi File Gambar ke Base64
    function convertBase64(file) {
        return new Promise((resolve, reject) => {
            const fileReader = new FileReader();
            fileReader.readAsDataURL(file);
            fileReader.onload = () => resolve(fileReader.result);
            fileReader.onerror = (error) => reject(error);
        });
    }

    // LISTENER REALTIME FIREBASE
    db.on('value', (snapshot) => {
        const data = snapshot.val();
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        if (!data) {
            tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Belum ada data laporan pekerjaan.</td></tr>';
            return;
        }

        let index = 1;
        for (let key in data) {
            const item = data[key];
            let badgeClass = 'badge-ringan';
            if (item.tingkatKerusakan === 'Sedang') badgeClass = 'badge-sedang';
            if (item.tingkatKerusakan === 'Berat') badgeClass = 'badge-berat';
            if (item.tingkatKerusakan === 'Ganti Unit') badgeClass = 'badge-ganti';

            const buktiBtn = item.buktiFoto 
                ? `<a href="${item.buktiFoto}" target="_blank" class="btn-view">👁️ Lihat</a>` 
                : `<span style="color:#94a3b8;">Tidak ada</span>`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index++}</td>
                <td>${item.tglMaintenance}</td>
                <td><strong>${item.namaTeknisi}</strong></td>
                <td>${item.jenisPekerjaan}</td>
                <td><span class="badge ${badgeClass}">${item.tingkatKerusakan}</span></td>
                <td>${item.durasiJam} Jam</td>
                <td>${item.deskripsi}</td>
                <td>${buktiBtn}</td>
                <td class="admin-action">
                    <button class="btn btn-sm btn-edit" onclick="editData('${key}')">Edit</button>
                    <button class="btn btn-sm btn-delete" onclick="deleteData('${key}')">Hapus</button>
                </td>
            `;
            tableBody.appendChild(row);
        }
        checkAdminAuth();
    });

    // CRUD: SIMPAN & EDIT DATA
    document.getElementById('workForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const key = document.getElementById('editKey').value;
        const fileInput = document.getElementById('buktiFoto');
        let imageBase64 = document.getElementById('existingImageBase64').value;

        if (fileInput.files.length > 0) {
            imageBase64 = await convertBase64(fileInput.files[0]);
        }

        const payload = {
            namaTeknisi: document.getElementById('namaTeknisi').value,
            jenisPekerjaan: document.getElementById('jenisPekerjaan').value,
            tingkatKerusakan: document.getElementById('tingkatKerusakan').value,
            tglMaintenance: document.getElementById('tglMaintenance').value,
            durasiJam: document.getElementById('durasiJam').value,
            deskripsi: document.getElementById('deskripsi').value,
            buktiFoto: imageBase64
        };

        if (key === "") {
            db.push(payload);
        } else {
            db.child(key).update(payload);
        }

        resetForm();
    });

    function editData(key) {
        db.child(key).once('value', (snapshot) => {
            const item = snapshot.val();
            document.getElementById('editKey').value = key;
            document.getElementById('namaTeknisi').value = item.namaTeknisi;
            document.getElementById('jenisPekerjaan').value = item.jenisPekerjaan;
            document.getElementById('tingkatKerusakan').value = item.tingkatKerusakan;
            document.getElementById('tglMaintenance').value = item.tglMaintenance;
            document.getElementById('durasiJam').value = item.durasiJam;
            document.getElementById('deskripsi').value = item.deskripsi;
            document.getElementById('existingImageBase64').value = item.buktiFoto || "";

            document.getElementById('formTitle').innerText = 'Edit Laporan Pekerjaan';
            document.getElementById('btnSave').innerText = 'Update Laporan';
            document.getElementById('btnCancel').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    function deleteData(key) {
        if (confirm('Apakah Anda yakin ingin menghapus laporan ini?')) {
            db.child(key).remove();
        }
    }

    function resetForm() {
        document.getElementById('workForm').reset();
        document.getElementById('editKey').value = "";
        document.getElementById('existingImageBase64').value = "";
        document.getElementById('formTitle').innerText = 'Tambah Laporan Pekerjaan Baru';
        document.getElementById('btnSave').innerText = 'Simpan Laporan';
        document.getElementById('btnCancel').style.display = 'none';
        document.getElementById('tglMaintenance').valueAsDate = new Date();
    }

    // Inisialisasi
    document.getElementById('tglMaintenance').valueAsDate = new Date();
    checkAdminAuth();
</script>

</body>
</html>
